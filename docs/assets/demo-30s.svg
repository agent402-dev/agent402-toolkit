<rect width="1000" height="448" rx="10" fill="#111827"/>
<circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
<text x="980" y="24" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">testnet · output 2026-11-26</text>
<text class="l0" x="20" y="54" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#93c5fd" xml:space="preserve"># 1. Seller: put a price on a route (pay-server, Base Sepolia testnet)</text>
<text class="l1" x="20" y="76" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve">paidRouteHandler({ path: &#x27;/x402/words&#x27;, priceUsd: 0.001 }, { base: { payTo: &#x27;0x1e8D…3975&#x27; } })</text>
<text class="l2" x="20" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve"></text>
<text class="l3" x="20" y="120" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#93c5fd" xml:space="preserve"># 2. Seller: read your own 402 the way a buyer does (no wallet)</text>
<text class="l4" x="20" y="142" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve">$ npx -y @agent402-dev/pay-server check http://127.0.0.1/x402/words?text=hello</text>
<text class="l5" x="20" y="164" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#86efac" xml:space="preserve">  ok    PAYMENT-REQUIRED header decodes.</text>
<text class="l6" x="20" y="186" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#86efac" xml:space="preserve">  ok    accepts[0]: Base Sepolia, 0.001 USDC (amount &quot;1000&quot;).</text>
<text class="l7" x="20" y="208" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#9ca3af" xml:space="preserve">  note  No extensions.bazaar: discovery catalogs cannot show an input example (optional).</text>
<text class="l8" x="20" y="230" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve"></text>
<text class="l9" x="20" y="252" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#93c5fd" xml:space="preserve"># 3. Buyer: the agent&#x27;s own rules (pay-mcp)</text>
<text class="l10" x="20" y="274" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve">  max 0.01 USD per payment · 0.01 USD per day · 3 payments per day</text>
<text class="l11" x="20" y="296" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve">  allowed host 127.0.0.1 · trusted recipient 0x1e8D…3975</text>
<text class="l12" x="20" y="318" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#c4b5fd" xml:space="preserve">&gt; x402_quote</text>
<text class="l13" x="20" y="340" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#e5e7eb" xml:space="preserve">  USDC 0.001 on eip155:84532 to 0x1e8D…3975 · chain: base</text>
<text class="l14" x="20" y="362" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#86efac" xml:space="preserve">  within your limits</text>
<text class="l15" x="20" y="384" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#c4b5fd" xml:space="preserve">&gt; x402_pay</text>
<text class="l16" x="20" y="406" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#86efac" xml:space="preserve">  paid · HTTP 200 · tx 0xfd1c6848…</text>
</svg>
