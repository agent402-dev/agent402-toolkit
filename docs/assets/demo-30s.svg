<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448" role="img" aria-label="Seller prices a route with pay-server, checks its 402, and a buyer agent quotes it within its own limits (Base Sepolia testnet)">
