# Copy to wrangler.toml and adjust. Secrets (SELLER_KEY, RPC_URL) are set with `wrangler secret put`, never here.
name = "my-bond-seller"
main = "index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobStoreDO"]

# Does the work and marks delivery for deals buyers have opened. Keep it frequent.
[triggers]
crons = ["*/2 * * * *"]

[vars]
# USDC smallest units: 1 USDC = 1000000. Beta limit: seller bond + buyer deposit at most 100 USDC per deal.
# ASSET = "PREQ"            # optional: USDC (default) or PREQ; amounts below are in that asset
PRICE = "20000000"          # 20 USDC
SELLER_BOND = "2000000"     # 2 USDC (at most 20% of the price); you lock it and get it back on delivery
BUYER_DEPOSIT = "5000000"   # 5 USDC, part of the price, locked by the buyer
DELIVER_SECONDS = "3600"    # you promise to deliver within 1 hour of opening
LATE_WINDOW = "0"           # 0..604800 seconds of late delivery with a pro-rata bond deduction
PAY_WINDOW = "86400"        # 1..30 days for the buyer to pay the balance after confirming
# Bond v2: PROTOCOL = "2" ignores LATE_WINDOW and PAY_WINDOW and uses these
# PROTOCOL = "2"
# GRACE = "86400"           # 1 hour .. 1 day after the delivery deadline to still mark
# REVIEW_WINDOW = "86400"   # 1 hour .. 7 days for the buyer to accept after delivery
DESCRIPTION = "Counts the words in a text"
# Optional: also sell the same work per request over x402 at POST /x402/job (USDC, no bond, paid to the seller wallet,
# which must already have a USDC token account). Not settled if your work throws.
# X402_PRICE_USD = "0.05"
# Signed receipts for x402 responses: set the RECEIPT_KEY secret (a separate key, not the seller key). See README.md.
# Optional: the address buyers use, if it differs from what the Worker sees (e.g. behind another proxy)
# PUBLIC_ORIGIN = "https://jobs.example.com"
