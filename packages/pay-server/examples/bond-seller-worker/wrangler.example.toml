# Copy to wrangler.toml and adjust. Secrets (SELLER_KEY, RPC_URL) are set with `wrangler secret put`, never here.
name = "my-bond-seller"
main = "index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobStoreDO"]

# Does the work and marks delivery for deals buyers have opened. Keep it frequent.
[triggers]
crons = ["*/2 * * * *"]

[vars]
# USDC smallest units: 1 USDC = 1000000. Beta limit: seller bond + buyer deposit at most 100 USDC per deal.
# Start small; raise the amounts once deals run as you expect.
# ASSET = "PREQ"            # optional: USDC (default) or PREQ; amounts below are in that asset
PRICE = "1000000"           # 1 USDC
SELLER_BOND = "100000"      # 0.1 USDC; you lock it and get it back when the deal ends normally
BUYER_DEPOSIT = "300000"    # 0.3 USDC, part of the price, locked by the buyer
DELIVER_SECONDS = "3600"    # you promise to deliver within 1 hour of opening
# Bond v2 (recommended: the buyer checks a hash of the exact result before paying)
PROTOCOL = "2"
GRACE = "3600"              # 1 hour .. 1 day after the delivery deadline to still mark delivery
REVIEW_WINDOW = "86400"     # 1 hour .. 7 days for the buyer to accept after delivery
# Bond v1 instead: remove PROTOCOL, GRACE and REVIEW_WINDOW and set
# LATE_WINDOW = "0"         # 0..604800 seconds of late delivery with a pro-rata bond deduction
# PAY_WINDOW = "86400"      # 1..30 days for the buyer to pay the balance after confirming
DESCRIPTION = "Counts the words in a text"
# Optional: also sell the same work per request over x402 at POST /x402/job (USDC, no bond, paid to the seller wallet,
# which must already have a USDC token account). Not settled if your work throws.
# X402_PRICE_USD = "0.05"
# Optional, with X402_PRICE_USD: also take USDC on Base at the same route (off unless X402_BASE_PAY_TO is set; see README.md).
# X402_BASE_PAY_TO = "0xYOUR_BASE_ADDRESS"                     # public address only; no key
# X402_BASE_FACILITATOR_URL = "https://your-facilitator.example" # one whose /supported lists exact on eip155:8453
# Optional, with X402_PRICE_USD: also take PREQ on Solana at the same USD price (off unless "on"; needs your seller wallet's PREQ token account; see README.md).
# X402_PREQ = "on"
# BASE_RPC_URL: set with `wrangler secret put BASE_RPC_URL` if it carries a provider key (read-only recheck after settle)
# Signed receipts for x402 responses: set the RECEIPT_KEY secret (a separate key, not the seller key). See README.md.
# Optional: the address buyers use, if it differs from what the Worker sees (e.g. behind another proxy)
# PUBLIC_ORIGIN = "https://jobs.example.com"
